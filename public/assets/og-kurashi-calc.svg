<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="630" fill="#f7f4e9"/><circle cx="960" cy="130" r="260" fill="#edf1d2"/><circle cx="1030" cy="550" r="250" fill="#f8d9ae"/><text x="95" y="190" font-family="sans-serif" font-size="72" font-weight="700" fill="#17675d">くらし算</text><text x="95" y="315" font-family="sans-serif" font-size="64" font-weight="700" fill="#203734">暮らしに必要な量と費用を、</text><text x="95" y="400" font-family="sans-serif" font-size="64" font-weight="700" fill="#203734">かんたんに計算。</text><text x="95" y="485" font-family="sans-serif" font-size="30" fill="#526a65">家族人数や日数を入れるだけで、必要な目安がすぐ分かります。</text><g transform="translate(880 235) scale(4.5)" color="#17675d"><path d="M13 31c1-13 9-22 19-22s18 9 19 22" fill="#fff" stroke="currentColor" stroke-width="2.2"/><path d="M11 31h42l-5 18c-1 4-4 6-8 6H24c-4 0-7-2-8-6Z" fill="#dbe69f" stroke="currentColor" stroke-width="2.2"/></g></svg>
