name: Apply completion bundle

on:
  push:
    branches:
      - feature/complete-initial-site
    paths:
      - .completion/trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completion branch
        uses: actions/checkout@v4
        with:
          ref: feature/complete-initial-site
          fetch-depth: 0

      - name: Verify and extract completion bundle
        shell: bash
        run: |
          base64 --decode .completion/kurashi-completion.tar.gz.b64 > /tmp/kurashi-completion.tar.gz
          echo "40e2734c8d1cacc55990191a5b650778e9f475eb86953d253e85466d610e3df2  /tmp/kurashi-completion.tar.gz" | sha256sum --check
          tar -xzf /tmp/kurashi-completion.tar.gz
          rm -rf .completion
          rm -f .github/workflows/apply-completion.yml

      - name: Commit completed site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete initial kurashi calc site"
          git push origin HEAD:feature/complete-initial-site
